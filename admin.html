<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>紙張需求管理｜總務課</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#243247;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{background:#14532d;color:#fff;padding:20px 16px}header div,main{max-width:1200px;margin:auto}
h1{font-size:23px;margin:0 0 6px}.sub{font-size:14px;opacity:.9}main{padding:22px 14px 40px}
.panel{background:white;border:1px solid #dfe7e1;border-radius:12px;padding:16px;margin-bottom:16px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}select,input,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:7px}
button{background:#14532d;color:white;border:0;cursor:pointer}.hint{font-size:13px;color:#64748b;margin-top:8px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap;font-size:14px}th{background:#f0f5f1}
.error{color:#b91c1c;white-space:pre-wrap}.muted{color:#64748b}.field{display:flex;flex-direction:column;gap:5px;min-width:180px}.field label{font-size:13px;color:#475569}.field input{min-width:180px}.primary{background:#166534}.success{color:#166534;white-space:pre-wrap}
a{color:inherit}
</style>
</head>
<body>
<header><div><h1>紙張需求管理</h1><div class="sub">總務課管理中心｜查看各單位季度申請紀錄</div></div></header>
<main>
<section class="panel">
<div class="controls">
<strong id="state">正在驗證管理員身分……</strong>
<button id="reload" type="button">重新載入</button>
<a href="../inventory-system/admin-center.html">返回統一管理中心</a>
</div>
<div id="message" class="hint">僅限核准管理帳號使用。</div>
</section>
<section class="panel">
<h2 style="font-size:18px;margin:0 0 12px">新增申請季度</h2>
<div class="controls" style="align-items:flex-end">
  <div class="field"><label for="newQuarterName">季度名稱</label><input id="newQuarterName" placeholder="例如：116年第1季" maxlength="30"></div>
  <div class="field"><label for="newPeriodStart">申請開放日（季度起始日）</label><input id="newPeriodStart" type="date"></div>
  <div class="field"><label for="newDeadline">申請截止日</label><input id="newDeadline" type="date"></div>
  <label style="display:flex;align-items:center;gap:7px;padding:10px 0"><input id="newQuarterActive" type="checkbox" checked style="width:auto"> 啟用此季度</label>
  <button id="createQuarter" type="button" class="primary">新增季度</button>
</div>
<div id="quarterMessage" class="hint">設定開放日及截止日後新增。啟用中的季度會依開放日自動生效，截止日過後前台停止受理。</div>
</section>
<section class="panel">
<div class="controls">
<label for="quarter">季度：</label><select id="quarter"><option value="">全部季度</option></select>
<label for="unit">單位：</label><select id="unit"><option value="">全部單位</option></select>
<input id="search" placeholder="搜尋單位或填寫人" aria-label="搜尋單位或填寫人">
</div>
<p id="summary" class="hint">尚未載入資料。</p>
<div class="table-wrap"><table><thead><tr><th>季度</th><th>單位</th><th>填寫人</th><th>報表紙（箱）</th><th>A4（組）</th><th>A3（組）</th><th>B4（組）</th><th>B5（組）</th><th>申請編號</th></tr></thead><tbody id="rows"><tr><td colspan="9">等待驗證登入。</td></tr></tbody></table></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";
const URL="https://onebxqajsiqmhfcizaxl.supabase.co";
const KEY="sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";
const ALLOWED="tscgad917@gmail.com";
const token=localStorage.getItem("admin_access_token");
const refresh=localStorage.getItem("admin_refresh_token");
const email=(localStorage.getItem("admin_email")||"").toLowerCase();
const $=id=>document.getElementById(id);
let db=null, allRows=[];
function escapeHTML(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function loginAgain(){
 $("state").textContent="尚未通過登入驗證";
 showError("目前頁面未取得有效的統一登入資訊，或登入帳號未獲授權。\n為保留排查線索，這個頁面不會清除登入資料，也不會自動跳轉。\n請回統一管理中心重新登入後，再點選「紙張需求管理」。");
}
function showError(msg){$("message").className="hint error";$("message").textContent=msg;}
async function init(){
 // 導覽限制：首次進入需由統一管理中心點選；同一分頁重新整理可繼續使用。
 // 這是前端導覽限制，不取代 Supabase 的身分驗證與 RLS 權限。
 const nav=performance.getEntriesByType("navigation")[0];
 const isReload=nav&&nav.type==="reload";
 const ticket=sessionStorage.getItem("paperAdminEntryTicket")==="from-center";
 const fromCenter=ticket;
 sessionStorage.removeItem("paperAdminEntryTicket");
 if(!fromCenter&&!(isReload&&sessionStorage.getItem("paperAdminTabAuthorized")==="yes")){
  document.body.innerHTML='<main style="max-width:680px;margin:60px auto;padding:24px;font-family:Arial,sans-serif;line-height:1.8;color:#26332c"><h2>請由統一管理中心進入</h2><p>為避免直接開啟後台連結，請先返回統一管理中心，再由管理中心選擇「紙張需求管理」。</p></main>';
  return;
 }
 sessionStorage.setItem("paperAdminTabAuthorized","yes");
 db=window.supabase.createClient(URL,KEY);
 let sessionResult=await db.auth.getSession();
 if(sessionResult.error)throw sessionResult.error;
 let session=sessionResult.data&&sessionResult.data.session;

 // 優先使用統一登入入口保存的 Supabase 共用 session。
 // 舊版 localStorage 憑證僅作相容備援，不要求使用者再次輸入帳密。
 if(!session){
  const legacyToken=localStorage.getItem("admin_access_token");
  const legacyRefresh=localStorage.getItem("admin_refresh_token");
  const legacyEmail=(localStorage.getItem("admin_email")||"").toLowerCase();
  if(!legacyToken||!legacyRefresh||legacyEmail!==ALLOWED){
   loginAgain();
   return;
  }
  sessionResult=await db.auth.setSession({access_token:legacyToken,refresh_token:legacyRefresh});
  if(sessionResult.error)throw sessionResult.error;
  session=sessionResult.data&&sessionResult.data.session;
 }
 if(!session)throw new Error("Supabase 未回傳有效的登入 session。");

 const user=await db.auth.getUser();
 if(user.error)throw user.error;
 const actualEmail=(user.data.user.email||"").toLowerCase();
 if(actualEmail!==ALLOWED){
  await db.auth.signOut();
  throw new Error("目前登入的帳號未獲授權。");
 }
 localStorage.setItem("admin_access_token",session.access_token);
 localStorage.setItem("admin_refresh_token",session.refresh_token);
 localStorage.setItem("admin_email",actualEmail);

 $("state").textContent="已登入："+actualEmail;
 await loadFilters();
 await loadRows();
}
async function createQuarter(){
 const name=$("newQuarterName").value.trim();
 const start=$("newPeriodStart").value;
 const deadline=$("newDeadline").value;
 const active=$("newQuarterActive").checked;
 const msg=$("quarterMessage");
 if(!name||!start||!deadline){msg.className="hint error";msg.textContent="請填寫季度名稱、申請開放日及申請截止日。";return;}
 if(deadline<start){msg.className="hint error";msg.textContent="申請截止日不可早於申請開放日。";return;}
 const button=$("createQuarter");
 button.disabled=true;button.textContent="新增中……";
 msg.className="hint";msg.textContent="正在新增季度……";
 try{
  const {data,error}=await db.from("quarters").insert({
   quarter_name:name,
   period_start:start,
   deadline:deadline,
   is_active:active
  }).select("id,quarter_name,period_start,deadline,is_active").single();
  if(error)throw error;
  const option=document.createElement("option");
  option.value=data.id;option.textContent=data.quarter_name;
  $("quarter").insertBefore(option,$("quarter").children[1]||null);
  $("quarter").value=String(data.id);
  $("newQuarterName").value="";
  msg.className="hint success";
  msg.textContent="已新增「"+data.quarter_name+"」。開放日："+data.period_start+"；截止日："+data.deadline+"；"+(data.is_active?"已啟用":"尚未啟用")+"。";
 }catch(e){
  console.error(e);
  msg.className="hint error";
  msg.textContent="新增失敗："+e.message+"。請確認 quarters 的 authenticated INSERT 權限及管理員 RLS 政策。";
 }finally{
  button.disabled=false;button.textContent="新增季度";
 }
}
async function loadFilters(){
 const [q,u]=await Promise.all([
  db.from("quarters").select("id,quarter_name,period_start").order("period_start",{ascending:false}),
  db.from("units").select("id,name").order("id",{ascending:true})
 ]);
 if(q.error)throw q.error;if(u.error)throw u.error;
 q.data.forEach(x=>{const o=document.createElement("option");o.value=x.id;o.textContent=x.quarter_name;$("quarter").appendChild(o);});
 u.data.forEach(x=>{const o=document.createElement("option");o.value=x.id;o.textContent=x.name;$("unit").appendChild(o);});
}
async function loadRows(){
 $("rows").innerHTML='<tr><td colspan="9">資料讀取中……</td></tr>';
 $("message").className="hint";$("message").textContent="";
 const {data,error}=await db.from("quarterly_requests").select("id,quarter_id,unit_id,applicant_name,report_paper_boxes,a4_sets,a3_sets,b4_sets,b5_sets,quarters(quarter_name),units(name)").order("id",{ascending:false});
 if(error){$("rows").innerHTML='<tr><td colspan="9">無法讀取資料。</td></tr>';showError("讀取失敗："+error.message+"\n請確認 quarterly_requests 的 authenticated SELECT RLS 政策及資料表關聯。");$("summary").textContent="讀取失敗";return;}
 allRows=data||[];
 render();
}
function render(){
 const q=$("quarter").value,u=$("unit").value,s=$("search").value.trim().toLowerCase();
 const rows=allRows.filter(r=>(!q||String(r.quarter_id)===q)&&(!u||String(r.unit_id)===u)&&(!s||String(r.units?.name||"").toLowerCase().includes(s)||String(r.applicant_name||"").toLowerCase().includes(s)));
 $("summary").textContent="共 "+rows.length+" 筆申請紀錄";
 if(!rows.length){$("rows").innerHTML='<tr><td colspan="9">沒有符合條件的申請紀錄。</td></tr>';return;}
 $("rows").innerHTML=rows.map(r=>'<tr><td>'+escapeHTML(r.quarters?.quarter_name||r.quarter_id)+'</td><td>'+escapeHTML(r.units?.name||r.unit_id)+'</td><td>'+escapeHTML(r.applicant_name)+'</td><td>'+Number(r.report_paper_boxes||0)+'</td><td>'+Number(r.a4_sets||0)+'</td><td>'+Number(r.a3_sets||0)+'</td><td>'+Number(r.b4_sets||0)+'</td><td>'+Number(r.b5_sets||0)+'</td><td>'+escapeHTML(r.id)+'</td></tr>').join("");
}
$("reload").addEventListener("click",()=>{ $("quarter").innerHTML='<option value="">全部季度</option>'; $("unit").innerHTML='<option value="">全部單位</option>'; loadFilters().then(loadRows).catch(e=>showError("載入失敗："+e.message)); });
$("createQuarter").addEventListener("click",createQuarter);
["quarter","unit","search"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",render));
init().catch(e=>{console.error(e);showError("登入或初始化失敗："+e.message);});
})();
</script>
</body>
</html>
