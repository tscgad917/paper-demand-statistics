<script>

  /*
   * ============================================================
   * Supabase 設定
   * ============================================================
   *
   * 已改為使用「庫存統計」主專案
   */

  const SUPABASE_URL =
    "https://onebxqajsiqmhfcizax.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";


  let currentQuarter = null;


  /*
   * ============================================================
   * 共用函式
   * ============================================================
   */

  function showMessage(
    text,
    type
  ) {

    const message =
      document.getElementById("message");

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display =
      "block";

  }


  function hideMessage() {

    const message =
      document.getElementById("message");

    message.style.display =
      "none";

  }


  /*
   * ============================================================
   * 載入目前季度
   * ============================================================
   */

  async function loadQuarter() {

    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/quarters" +
          "?select=id,period_start,quarter_name,deadline,is_active" +
          "&is_active=eq.true" +
          "&order=period_start.desc" +
          "&limit=1",
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization:
                "Bearer " + SUPABASE_KEY
            }
          }
        );


      if (!response.ok) {

        throw new Error(
          "季度資料載入失敗"
        );

      }


      const data =
        await response.json();


      if (!data.length) {

        throw new Error(
          "目前沒有開放中的季度"
        );

      }


      currentQuarter =
        data[0];


      const deadlineDate =
        new Date(
          currentQuarter.deadline +
          "T23:59:59"
        );


      const today =
        new Date();


      document.getElementById(
        "deadline"
      ).textContent =
        currentQuarter.quarter_name +
        " 填寫截止日：" +
        currentQuarter.deadline;


      document.getElementById(
        "loading"
      ).style.display =
        "none";


      if (today > deadlineDate) {

        document.getElementById(
          "closedArea"
        ).innerHTML =
          '<div class="closed">' +
          currentQuarter.quarter_name +
          '申請期限已截止。' +
          '</div>';

        document.getElementById(
          "closedArea"
        ).style.display =
          "block";

        return;

      }


      document.getElementById(
        "formArea"
      ).style.display =
        "block";

    } catch (error) {

      console.error(error);

      document.getElementById(
        "loading"
      ).style.display =
        "none";

      showMessage(
        error.message ||
        "資料載入失敗，請稍後再試。",
        "error"
      );

    }

  }


  /*
   * ============================================================
   * 載入單位
   * ============================================================
   *
   * 注意：
   * 主「庫存統計」專案的 units 沒有 sort_order 欄位。
   * 因此改用 id 排序。
   */

  async function loadUnits() {

    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/units" +
          "?select=id,name" +
          "&order=id.asc",
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization:
                "Bearer " + SUPABASE_KEY
            }
          }
        );


      if (!response.ok) {

        throw new Error(
          "單位資料載入失敗"
        );

      }


      const units =
        await response.json();


      const select =
        document.getElementById(
          "unit"
        );


      units.forEach(
        function(unit) {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            unit.id;

          option.textContent =
            unit.name;

          select.appendChild(
            option
          );

        }
      );


    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "單位資料載入失敗。",
        "error"
      );

    }

  }


  /*
   * ============================================================
   * 載入上一季資料
   * ============================================================
   */

  async function loadPreviousReference() {

    const unitId =
      document.getElementById(
        "unit"
      ).value;


    const referenceArea =
      document.getElementById(
        "referenceArea"
      );


    if (!unitId || !currentQuarter) {

      referenceArea.style.display =
        "none";

      return;

    }


    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/rpc/get_previous_quarter_reference",
          {
            method: "POST",

            headers: {
              apikey: SUPABASE_KEY,
              Authorization:
                "Bearer " + SUPABASE_KEY,
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              p_quarter_id:
                currentQuarter.id,

              p_unit_id:
                Number(unitId)
            })
          }
        );


      if (!response.ok) {

        throw new Error(
          "上一季資料載入失敗"
        );

      }


      const data =
        await response.json();


      if (!data.length) {

        referenceArea.style.display =
          "none";

        return;

      }


      const previous =
        data[0];


      document.getElementById(
        "refReport"
      ).textContent =
        previous.report_paper_boxes ??
        0;


      document.getElementById(
        "refA4"
      ).textContent =
        previous.a4_sets ??
        0;


      document.getElementById(
        "refA3"
      ).textContent =
        previous.a3_sets ??
        0;


      document.getElementById(
        "refB4"
      ).textContent =
        previous.b4_sets ??
        0;


      document.getElementById(
        "refB5"
      ).textContent =
        previous.b5_sets ??
        0;


      referenceArea.style.display =
        "block";


    } catch (error) {

      console.error(error);

      referenceArea.style.display =
        "none";

    }

  }


  /*
   * ============================================================
   * 送出表單
   * ============================================================
   */

  async function submitForm() {

    hideMessage();


    if (!currentQuarter) {

      showMessage(
        "目前沒有可填寫的季度。",
        "error"
      );

      return;

    }


    const applicant =
      document.getElementById(
        "applicant"
      ).value.trim();


    const unitId =
      document.getElementById(
        "unit"
      ).value;


    if (!applicant) {

      showMessage(
        "請輸入填寫人。",
        "error"
      );

      return;

    }


    if (!unitId) {

      showMessage(
        "請選擇單位。",
        "error"
      );

      return;

    }


    const reportPaper =
      Number(
        document.getElementById(
          "reportPaper"
        ).value
      ) || 0;


    const a4 =
      Number(
        document.getElementById(
          "a4"
        ).value
      ) || 0;


    const a3 =
      Number(
        document.getElementById(
          "a3"
        ).value
      ) || 0;


    const b4 =
      Number(
        document.getElementById(
          "b4"
        ).value
      ) || 0;


    const b5 =
      Number(
        document.getElementById(
          "b5"
        ).value
      ) || 0;


    if (
      reportPaper < 0 ||
      a4 < 0 ||
      a3 < 0 ||
      b4 < 0 ||
      b5 < 0
    ) {

      showMessage(
        "數量不可小於 0。",
        "error"
      );

      return;

    }


    const submitBtn =
      document.getElementById(
        "submitBtn"
      );


    submitBtn.disabled =
      true;

    submitBtn.textContent =
      "送出中...";


    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/quarterly_requests",
          {
            method: "POST",

            headers: {
              apikey: SUPABASE_KEY,
              Authorization:
                "Bearer " + SUPABASE_KEY,
              "Content-Type":
                "application/json",
              Prefer:
                "return=minimal"
            },

            body:
              JSON.stringify({
                quarter_id:
                  currentQuarter.id,

                unit_id:
                  Number(unitId),

                applicant_name:
                  applicant,

                report_paper_boxes:
                  reportPaper,

                a4_sets:
                  a4,

                a3_sets:
                  a3,

                b4_sets:
                  b4,

                b5_sets:
                  b5
              })
          }
        );


      if (!response.ok) {

        const errorText =
          await response.text();

        console.error(
          "Supabase error:",
          errorText
        );


        if (
          response.status === 409
        ) {

          throw new Error(
            "此單位本季已經填寫過需求，無法重複送出。"
          );

        }


        throw new Error(
          "送出失敗，請稍後再試。"
        );

      }


      showMessage(
        "需求已成功送出！",
        "success"
      );


      document.getElementById(
        "applicant"
      ).value =
        "";


      document.getElementById(
        "unit"
      ).value =
        "";


      document.getElementById(
        "reportPaper"
      ).value =
        "0";


      document.getElementById(
        "a4"
      ).value =
        "0";


      document.getElementById(
        "a3"
      ).value =
        "0";


      document.getElementById(
        "b4"
      ).value =
        "0";


      document.getElementById(
        "b5"
      ).value =
        "0";


      document.getElementById(
        "referenceArea"
      ).style.display =
        "none";


    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "送出失敗，請稍後再試。",
        "error"
      );

    } finally {

      submitBtn.disabled =
        false;

      submitBtn.textContent =
        "送出需求";

    }

  }


  /*
   * ============================================================
   * 事件
   * ============================================================
   */

  document
    .getElementById("unit")
    .addEventListener(
      "change",
      loadPreviousReference
    );


  document
    .getElementById("submitBtn")
    .addEventListener(
      "click",
      submitForm
    );


  /*
   * ============================================================
   * 初始化
   * ============================================================
   */

  async function init() {

    await loadUnits();

    await loadQuarter();

  }


  init();

</script>

</body>
</html>
