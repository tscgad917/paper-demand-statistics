<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>年度大量傳票需求管理｜總務課</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f2;color:#3f4b3b;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{background:#44633f;color:#fff;padding:20px 16px}header>div,main{max-width:1180px;margin:auto}h1{font-size:22px;margin:0 0 5px}.sub{font-size:14px;opacity:.9}
main{padding:22px 14px 44px}.panel{background:#fff;border:1px solid #dfe7dc;border-radius:12px;padding:17px;margin-bottom:15px;box-shadow:0 2px 8px #3f4b3b0a}
h2{font-size:18px;color:#365333;margin:0 0 13px}.muted,.hint{font-size:13px;color:#718071;line-height:1.65}.error{color:#b42318;white-space:pre-wrap}.success{color:#166534;white-space:pre-wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:13px;font-weight:650}
input,select,textarea,button{font:inherit}input,select,textarea{padding:10px;border:1px solid #cbd5cb;border-radius:7px;background:#fff;min-width:0}textarea{min-height:76px;resize:vertical}
button{border:0;border-radius:7px;background:#44633f;color:#fff;padding:10px 14px;cursor:pointer;font-weight:650}button.secondary{background:#eaf1e9;color:#365333;border:1px solid #d7e3d5}button.danger{background:#a33d36}button:disabled{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{display:inline-block;border-radius:999px;background:#edf4ed;color:#365333;padding:4px 9px;font-size:12px}.status.off{background:#f2f2f2;color:#666}
.list{display:grid;gap:8px}.survey-row{border:1px solid #e1e8e1;border-radius:8px;padding:11px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.survey-row strong{display:block}.checkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.check{display:flex;align-items:center;gap:7px;font-size:14px}.check input{width:17px;height:17px}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:680px}th,td{padding:9px 10px;border-bottom:1px solid #e6ebe5;text-align:left;font-size:13px;vertical-align:top}th{background:#f2f6f1}
.question-row{border:1px solid #e0e8e0;border-radius:8px;padding:12px;margin:8px 0}.question-row .meta{font-size:12px;color:#6d7a6d;margin-top:4px}
.hidden{display:none!important}.preview{max-width:140px;max-height:100px;object-fit:contain;border:1px solid #ddd;border-radius:6px}
@media(max-width:600px){main{padding:16px 10px 32px}.panel{padding:14px}}
</style>
</head>
<body>
<header><div><h1>年度大量傳票需求管理</h1><div class="sub">總務課統一管理中心｜年度傳票需求問卷、填報單位、題目圖片及統計</div></div></header>
<main>
<section class="panel">
  <div class="actions"><strong id="identity">正在驗證管理員身分……</strong><button class="secondary" id="reload">重新載入</button><a href="../../inventory-system/admin-center.html">返回統一管理中心</a></div>
  <div id="notice" class="hint">僅限已獲授權的管理帳號使用。</div>
</section>
<section class="panel">
  <h2>建立年度問卷</h2>
  <div class="grid">
    <div class="field"><label for="newTitle">問卷名稱</label><input id="newTitle" placeholder="例如：116年度常用傳票及印刷品需求調查" maxlength="120"></div>
    <div class="field"><label for="newYear">年度</label><input id="newYear" type="number" min="1" placeholder="例如：116"></div>
    <div class="field"><label for="newOpen">開放時間</label><input id="newOpen" type="datetime-local"></div>
    <div class="field"><label for="newClose">截止時間</label><input id="newClose" type="datetime-local"></div>
  </div>
  <div class="field" style="margin-top:10px"><label for="newDescription">填報說明</label><textarea id="newDescription" placeholder="請依本單位預估需求填報下一年度數量。"></textarea></div>
  <div class="actions" style="margin-top:12px"><button id="createSurvey">建立問卷</button><span class="hint">新問卷預設為未發布，完成題目及單位設定後再發布。</span></div>
  <div id="createMessage" class="hint"></div>
</section>
<section class="panel">
  <div class="actions" style="justify-content:space-between"><h2 style="margin:0">年度問卷清單</h2><div class="actions"><select id="copySource"><option value="">選擇要複製的既有問卷</option></select><button id="copySurvey" class="secondary">複製問卷</button></div></div>
  <div id="surveyList" class="list" style="margin-top:12px">載入中……</div>
</section>
<section class="panel hidden" id="editor">
  <div class="actions" style="justify-content:space-between;align-items:flex-start"><div><h2 id="editTitle" style="margin-bottom:4px">問卷設定</h2><div id="editMeta" class="muted"></div></div><div class="actions"><span id="publishState" class="status off">未發布</span><button id="togglePublish">發布問卷</button></div></div>
  <div class="actions" style="margin:12px 0"><input id="publicUrl" readonly style="flex:1;min-width:220px"><button id="copyUrl" class="secondary">複製填答網址</button></div>
  <div class="hint" id="publishHint">發布後，填答者可於設定期間透過網址填寫；截止後資料自動停止受理。</div>
  <hr style="border:0;border-top:1px solid #e5ebe4;margin:18px 0">
  <h2>指定填報單位</h2>
  <div class="actions" style="margin-bottom:9px"><button class="secondary" id="selectAllUnits">全選</button><button class="secondary" id="clearUnits">清除</button><button id="saveUnits">儲存填報單位</button></div>
  <div id="unitChecks" class="checkgrid">讀取單位中……</div>
  <div id="unitMessage" class="hint"></div>
  <hr style="border:0;border-top:1px solid #e5ebe4;margin:18px 0">
  <div class="actions" style="justify-content:space-between"><h2 style="margin:0">新增題目／品項</h2><button id="load116Template" class="secondary" type="button">載入116年度大量印刷品範本</button></div>
  <div class="grid">
    <div class="field"><label for="qTitle">題目或品項名稱</label><input id="qTitle" maxlength="180" placeholder="例如：存1傳票"></div>
    <div class="field"><label for="qType">題型</label><select id="qType"><option value="number">數量填報</option><option value="text">單行文字</option><option value="textarea">多行文字</option><option value="single_choice">單選</option><option value="multiple_choice">多選</option><option value="date">日期</option></select></div>
    <div class="field"><label for="qUnit">數量單位（數量題型適用）</label><input id="qUnit" placeholder="例如：本、份、箱"></div>
    <div class="field"><label for="qImage">品項圖片（非必填）</label><input id="qImage" type="file" accept="image/jpeg,image/png,image/webp"></div>
  </div>
  <div class="field" style="margin-top:10px"><label for="qDescription">補充說明／規格</label><textarea id="qDescription" placeholder="例如：規格、尺寸、用途或填報注意事項"></textarea></div>
  <div class="field"><label for="qOptions">選項（單選／多選題使用，每行一個選項）</label><textarea id="qOptions" placeholder="選項一&#10;選項二&#10;選項三"></textarea></div>
  <div class="actions"><label class="check"><input id="qRequired" type="checkbox"> 必填題目</label><label class="check"><input id="qAllowOther" type="checkbox"> 單選題允許填寫其他內容</label><button id="addQuestion">新增題目</button></div>
  <div id="questionMessage" class="hint"></div>
  <div id="questionList" style="margin-top:12px"></div>
  <hr style="border:0;border-top:1px solid #e5ebe4;margin:18px 0">
  <div class="actions" style="justify-content:space-between"><h2 style="margin:0">填報進度及結果</h2><button id="exportCsv" class="secondary">匯出 Excel 相容 CSV</button></div>
  <div id="progress" class="hint" style="margin:10px 0">尚未載入。</div>
  <div class="table-wrap"><table><thead id="resultHead"></thead><tbody id="resultBody"><tr><td>尚無資料</td></tr></tbody></table></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";
const URL="https://onebxqajsiqmhfcizaxl.supabase.co";
const KEY="sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";
const IMAGE_BUCKET="general-survey-images";
const db=window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
let currentUser=null, units=[], surveys=[], selected=null, questions=[], assignments=[], submissions=[];
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function note(id,msg,type){$(id).className="hint "+(type||"");$(id).textContent=msg||"";}
function localInputValue(d){const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")+"T"+String(x.getHours()).padStart(2,"0")+":"+String(x.getMinutes()).padStart(2,"0");}
function ticketCheck(){
 const nav=performance.getEntriesByType("navigation")[0],reload=nav&&nav.type==="reload";
 const ticket=sessionStorage.getItem("surveyAdminEntryTicket")==="from-center";
 sessionStorage.removeItem("surveyAdminEntryTicket");
 if(!ticket&&!(reload&&sessionStorage.getItem("surveyAdminTabAuthorized")==="yes")){
  document.body.innerHTML='<main style="max-width:680px;margin:60px auto;padding:24px;line-height:1.8"><h2>請由統一管理中心進入</h2><p>請返回總務課統一管理中心，再選擇通用問卷平台。</p></main>';return false;
 }
 sessionStorage.setItem("surveyAdminTabAuthorized","yes");return true;
}
async function init(){
 if(!ticketCheck())return;
 const {data:s,error:se}=await db.auth.getSession();if(se)throw se;
 let session=s?.session;
 if(!session){
  const token=localStorage.getItem("admin_access_token"),refresh=localStorage.getItem("admin_refresh_token");
  if(!token||!refresh)throw new Error("找不到統一登入狀態，請重新登入。");
  const restored=await db.auth.setSession({access_token:token,refresh_token:refresh});if(restored.error)throw restored.error;session=restored.data.session;
 }
 if(!session)throw new Error("未取得有效登入 session。");
 const {data:user,error:ue}=await db.auth.getUser();if(ue)throw ue;
 const email=(user.user.email||"").toLowerCase();
 const {data:auth,error:ae}=await db.from("admin_authorizations").select("email,role,is_active").eq("email",email).eq("is_active",true).maybeSingle();
 if(ae)throw ae;if(!auth)throw new Error("目前帳號未獲授權或管理權限已停用。");
 currentUser=user.user;
 localStorage.setItem("admin_access_token",session.access_token);localStorage.setItem("admin_refresh_token",session.refresh_token);localStorage.setItem("admin_email",email);localStorage.setItem("admin_role",auth.role);
 $("identity").textContent="已登入："+email;
 const {data:u,error:un}=await db.from("units").select("id,name").order("id",{ascending:true});if(un)throw un;units=u||[];
 await loadSurveys();
}
async function loadSurveys(){
 const {data,error}=await db.from("general_surveys").select("*").order("target_year",{ascending:false}).order("created_at",{ascending:false});if(error)throw error;surveys=data||[];
 $("surveyList").innerHTML="";
 $("copySource").innerHTML='<option value="">選擇要複製的既有問卷</option>';
 surveys.forEach(s=>{
  const row=document.createElement("div");row.className="survey-row";
  const info=document.createElement("div");info.innerHTML="<strong>"+esc(s.title)+"</strong><span class='muted'>"+s.target_year+"年度｜"+esc(s.opens_at)+" ～ "+esc(s.closes_at)+"</span>";
  const actions=document.createElement("div");actions.className="actions";
  const badge=document.createElement("span");badge.className="status "+(s.is_published?"":"off");badge.textContent=s.is_published?"已發布":"草稿";
  const btn=document.createElement("button");btn.className="secondary";btn.textContent="管理問卷";btn.onclick=()=>selectSurvey(s.id);
  actions.append(badge,btn);row.append(info,actions);$("surveyList").appendChild(row);
  const op=document.createElement("option");op.value=s.id;op.textContent=s.target_year+"年度｜"+s.title;$("copySource").appendChild(op);
 });
 if(!surveys.length)$("surveyList").textContent="目前尚未建立問卷。";
}
async function createSurvey(){
 const title=$("newTitle").value.trim(),year=Number($("newYear").value),open=$("newOpen").value,close=$("newClose").value;
 if(!title||!Number.isInteger(year)||year<1||!open||!close){note("createMessage","請完整填寫問卷名稱、年度及開放／截止時間。","error");return;}
 if(new Date(close)<=new Date(open)){note("createMessage","截止時間必須晚於開放時間。","error");return;}
 $("createSurvey").disabled=true;
 try{
  const {data,error}=await db.from("general_surveys").insert({title,target_year:year,description:$("newDescription").value.trim(),opens_at:new Date(open).toISOString(),closes_at:new Date(close).toISOString(),is_published:false,created_by:currentUser.id}).select("*").single();
  if(error)throw error;
  note("createMessage","已建立問卷，請繼續指定填報單位及新增題目。","success");
  $("newTitle").value="";$("newDescription").value="";
  await loadSurveys();await selectSurvey(data.id);
 }catch(e){note("createMessage","建立失敗："+e.message,"error");}
 finally{$("createSurvey").disabled=false;}
}
async function copySurvey(){
 const sourceId=$("copySource").value;if(!sourceId){note("createMessage","請先選擇要複製的問卷。","error");return;}
 const source=surveys.find(s=>s.id===sourceId);if(!source)return;
 const year=Number(prompt("請輸入新問卷年度（民國年）：",String(source.target_year+1)));if(!Number.isInteger(year)||year<1)return;
 const open=prompt("請輸入開放時間（例如 2027-11-20T08:00）：","2027-11-20T08:00");
 const close=prompt("請輸入截止時間（例如 2027-12-05T17:00）：","2027-12-05T17:00");
 if(!open||!close||new Date(close)<=new Date(open)){alert("開放及截止時間不正確。");return;}
 try{
  const {data:clone,error}=await db.from("general_surveys").insert({title:year+"年度"+source.title.replace(/^\d+年度/,""),target_year:year,description:source.description,opens_at:new Date(open).toISOString(),closes_at:new Date(close).toISOString(),is_published:false,created_by:currentUser.id}).select("*").single();if(error)throw error;
  const {data:srcUnits,error:ue}=await db.from("general_survey_units").select("unit_id").eq("survey_id",sourceId);if(ue)throw ue;
  if(srcUnits?.length){const {error:e}=await db.from("general_survey_units").insert(srcUnits.map(x=>({survey_id:clone.id,unit_id:x.unit_id})));if(e)throw e;}
  const {data:srcQs,error:qe}=await db.from("general_survey_questions").select("*").eq("survey_id",sourceId).order("sort_order");if(qe)throw qe;
  for(const q of srcQs||[]){
   const {data:nq,error:ne}=await db.from("general_survey_questions").insert({survey_id:clone.id,sort_order:q.sort_order,title:q.title,description:q.description,question_type:q.question_type,is_required:q.is_required,image_path:q.image_path,settings:q.settings}).select("*").single();if(ne)throw ne;
   const {data:opts,error:oe}=await db.from("general_survey_options").select("sort_order,label,value,image_path").eq("question_id",q.id);if(oe)throw oe;
   if(opts?.length){const {error:ie}=await db.from("general_survey_options").insert(opts.map(o=>({...o,question_id:nq.id})));if(ie)throw ie;}
  }
  await loadSurveys();await selectSurvey(clone.id);note("createMessage","已複製上一份問卷的題目、圖片設定及填報單位；年度與開放期間已另行設定。","success");
 }catch(e){alert("複製失敗："+e.message);}
}
async function selectSurvey(id){
 const s=surveys.find(x=>x.id===id);if(!s)return;selected=s;$("editor").classList.remove("hidden");
 $("editTitle").textContent=s.title;$("editMeta").textContent=s.target_year+"年度｜"+new Date(s.opens_at).toLocaleString("zh-TW")+" 至 "+new Date(s.closes_at).toLocaleString("zh-TW");
 $("publicUrl").value=location.origin+location.pathname.replace(/admin\.html$/,"")+"?token="+s.public_token;
 $("publishState").textContent=s.is_published?"已發布":"未發布";$("publishState").className="status "+(s.is_published?"":"off");$("togglePublish").textContent=s.is_published?"停止發布":"發布問卷";
 await Promise.all([loadAssignments(),loadQuestions(),loadResults()]);
}
async function loadAssignments(){
 const {data,error}=await db.from("general_survey_units").select("unit_id").eq("survey_id",selected.id);if(error)throw error;assignments=(data||[]).map(x=>x.unit_id);
 $("unitChecks").innerHTML="";
 units.forEach(u=>{const label=document.createElement("label");label.className="check";const cb=document.createElement("input");cb.type="checkbox";cb.value=u.id;cb.checked=assignments.includes(u.id);label.append(cb,document.createTextNode(u.name));$("unitChecks").appendChild(label);});
}
async function saveUnits(){
 const ids=Array.from($("unitChecks").querySelectorAll("input:checked")).map(x=>Number(x.value));
 if(!ids.length){note("unitMessage","至少指定一個填報單位。","error");return;}
 try{
  const {error:del}=await db.from("general_survey_units").delete().eq("survey_id",selected.id);if(del)throw del;
  const {error}=await db.from("general_survey_units").insert(ids.map(unit_id=>({survey_id:selected.id,unit_id})));if(error)throw error;
  assignments=ids;note("unitMessage","已儲存 "+ids.length+" 個填報單位。","success");await loadResults();
 }catch(e){note("unitMessage","儲存失敗："+e.message,"error");}
}
async function addQuestion(){
 const title=$("qTitle").value.trim(),type=$("qType").value;
 if(!title){note("questionMessage","請輸入題目或品項名稱。","error");return;}
 const optionsText=$("qOptions").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if((type==="single_choice"||type==="multiple_choice")&&!optionsText.length){note("questionMessage","單選或多選題至少需要一個選項。","error");return;}
 $("addQuestion").disabled=true;
 try{
  let imagePath=null;const file=$("qImage").files[0];
  if(file){
   if(!["image/jpeg","image/png","image/webp"].includes(file.type))throw new Error("圖片僅支援 JPG、PNG、WEBP。");
   if(file.size>5*1024*1024)throw new Error("圖片不可超過 5 MB。");
   const path=selected.id+"/"+crypto.randomUUID()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
   const {error:up}=await db.storage.from(IMAGE_BUCKET).upload(path,file,{upsert:false,contentType:file.type});if(up)throw up;imagePath=path;
  }
  const {data:q,error}=await db.from("general_survey_questions").insert({survey_id:selected.id,sort_order:questions.length+1,title,description:$("qDescription").value.trim(),question_type:type,is_required:$("qRequired").checked,image_path:imagePath,settings:{unit_label:$("qUnit").value.trim(),min:0,step:1,allow_other:$("qAllowOther").checked}}).select("*").single();if(error)throw error;
  if(optionsText.length){const {error:oe}=await db.from("general_survey_options").insert(optionsText.map((label,i)=>({question_id:q.id,sort_order:i+1,label,value:label})));if(oe)throw oe;}
  $("qTitle").value="";$("qDescription").value="";$("qUnit").value="";$("qOptions").value="";$("qImage").value="";$("qRequired").checked=false;$("qAllowOther").checked=false;
  note("questionMessage","題目已新增。","success");await loadQuestions();
 }catch(e){note("questionMessage","新增失敗："+e.message,"error");}
 finally{$("addQuestion").disabled=false;}
}
async function loadQuestions(){
 const {data,error}=await db.from("general_survey_questions").select("*").eq("survey_id",selected.id).order("sort_order").order("created_at");if(error)throw error;questions=data||[];
 $("questionList").innerHTML="";
 for(const q of questions){
  const row=document.createElement("div");row.className="question-row";
  const title=document.createElement("strong");title.textContent=(q.sort_order+". "+q.title)+(q.is_required?"（必填）":"");
  const meta=document.createElement("div");meta.className="meta";meta.textContent=q.question_type+(q.settings?.unit_label?"｜單位："+q.settings.unit_label:"")+(q.description?"｜"+q.description:"")+(q.image_path?"｜已附圖片":"");
  row.append(title,meta);
  if(q.image_path){const img=document.createElement("img");img.className="preview";img.src=URL+"/storage/v1/object/public/"+IMAGE_BUCKET+"/"+q.image_path.split("/").map(encodeURIComponent).join("/");img.alt=q.title;row.appendChild(img);}
  const upload=document.createElement("input");upload.type="file";upload.accept="image/jpeg,image/png,image/webp";upload.style.maxWidth="250px";
  const uploadBtn=document.createElement("button");uploadBtn.className="secondary";uploadBtn.textContent=q.image_path?"更換圖片":"上傳圖片";uploadBtn.onclick=async()=>{
   const file=upload.files[0];if(!file){alert("請先選擇圖片。");return;}
   if(!["image/jpeg","image/png","image/webp"].includes(file.type)||file.size>5*1024*1024){alert("圖片限 JPG、PNG、WEBP，且不可超過 5 MB。");return;}
   uploadBtn.disabled=true;
   try{
    const path=selected.id+"/"+crypto.randomUUID()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const {error:up}=await db.storage.from(IMAGE_BUCKET).upload(path,file,{upsert:false,contentType:file.type});if(up)throw up;
    const {error:ue}=await db.from("general_survey_questions").update({image_path:path}).eq("id",q.id);if(ue)throw ue;
    if(q.image_path)await db.storage.from(IMAGE_BUCKET).remove([q.image_path]);
    await loadQuestions();
   }catch(e){alert("圖片上傳失敗："+e.message);}
   finally{uploadBtn.disabled=false;}
  };
  const del=document.createElement("button");del.className="danger";del.textContent="刪除";del.onclick=async()=>{if(!confirm("確定刪除此題目？既有填答答案也會一併刪除。"))return;const {error:e}=await db.from("general_survey_questions").delete().eq("id",q.id);if(e){alert("刪除失敗："+e.message);return;}await loadQuestions();await loadResults();};
  const controls=document.createElement("div");controls.className="actions";controls.append(upload,uploadBtn,del);row.appendChild(controls);$("questionList").appendChild(row);
 }
 if(!questions.length)$("questionList").textContent="尚未新增題目。";
}
async function loadResults(){
 const [unitRes,subRes]=await Promise.all([
  db.from("general_survey_units").select("unit_id,units(name)").eq("survey_id",selected.id),
  db.from("general_survey_submissions").select("id,unit_id,submitter_name,submitted_at,general_survey_answers(question_id,answer)").eq("survey_id",selected.id).order("submitted_at",{ascending:false})
 ]);
 if(unitRes.error)throw unitRes.error;if(subRes.error)throw subRes.error;
 assignments=unitRes.data||[];submissions=subRes.data||[];
 const submitted=new Set(submissions.map(x=>x.unit_id));
 $("progress").textContent="填報進度："+submitted.size+" / "+assignments.length+" 個單位已完成；尚未填報："+Math.max(0,assignments.length-submitted.size)+" 個單位。";
 $("resultHead").innerHTML="<tr><th>填報單位</th><th>填報人</th><th>最後提交時間</th>"+questions.map(q=>"<th>"+esc(q.title)+"</th>").join("")+"</tr>";
 const names=new Map(units.map(u=>[u.id,u.name]));
 const byUnit=new Map(submissions.map(s=>[s.unit_id,s]));
 $("resultBody").innerHTML=assignments.map(a=>{
  const s=byUnit.get(a.unit_id),answers=new Map((s?.general_survey_answers||[]).map(x=>[x.question_id,x.answer]));
  return "<tr><td>"+esc(names.get(a.unit_id)||a.units?.name||a.unit_id)+"</td><td>"+esc(s?.submitter_name||"尚未填報")+"</td><td>"+(s?esc(new Date(s.submitted_at).toLocaleString("zh-TW")):"—")+"</td>"+questions.map(q=>"<td>"+esc(formatAnswer(answers.get(q.id)))+"</td>").join("")+"</tr>";
 }).join("")||'<tr><td colspan="3">尚未指定填報單位。</td></tr>';
}
function formatAnswer(a){if(a==null)return "—";if(Array.isArray(a))return a.join("、");if(typeof a==="object"){if(a.choice==="__other__")return "其他："+(a.other||"");return JSON.stringify(a);}return String(a);}
function csvCell(v){let s=String(v==null?"":v);if(/^[=+@\\-\\t\\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportCsv(){
 const names=new Map(units.map(u=>[u.id,u.name])),byUnit=new Map(submissions.map(s=>[s.unit_id,s]));
 const head=["年度","問卷名稱","填報單位","填報人","最後提交時間",...questions.map(q=>q.title)];
 const rows=[head];
 assignments.forEach(a=>{const s=byUnit.get(a.unit_id),ans=new Map((s?.general_survey_answers||[]).map(x=>[x.question_id,x.answer]));rows.push([selected.target_year,selected.title,names.get(a.unit_id)||a.unit_id,s?.submitter_name||"",s?.submitted_at||"",...questions.map(q=>formatAnswer(ans.get(q.id)))]);});
 const csv="\uFEFF"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"}),url=window.URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=selected.target_year+"年度問卷填報結果.csv";a.click();window.URL.revokeObjectURL(url);
}
async function togglePublish(){
 const next=!selected.is_published;
 if(next&&(!assignments.length||!questions.length)){alert("發布前請至少設定一個填報單位及一個題目。");return;}
 if(next&&!confirm("確定發布此問卷？符合開放時間後，填答者即可使用填答網址。"))return;
 const {data,error}=await db.from("general_surveys").update({is_published:next,updated_at:new Date().toISOString()}).eq("id",selected.id).select("*").single();
 if(error){alert("更新失敗："+error.message);return;}selected=data;await loadSurveys();await selectSurvey(data.id);
}

  ["存10：支出傳票","此傳票一箱為10,000張。依116年正常工作天數244天，1箱傳票可供一營業單位每天使用40張。",["0箱","0.5箱","1箱","2箱","3箱"],"箱"],
  ["存11：收入傳票","此傳票一箱為10,000張。依116年正常工作天數244天，1箱傳票可供一營業單位每天使用40張。",["0箱","0.5箱","1箱","2箱","3箱"],"箱"],

  ["會1（8070）：科目試算／結帳表","此表一箱為5,000張。依116年正常工作天數244天，1箱可供一營業單位每天試算／結帳20次。",["0箱","1箱","2箱","3箱"],"箱"],
  ["#044（8086）：科目日結單","此傳票一箱為10,000張。依116年正常工作天數244天，1箱可供一營業單位每天40種會計科目。",["0箱","0.5箱","1箱","2箱","3箱"],"箱"],
  ["#064（8440）：櫃員現金收受表","此傳票一箱為5,300張。依116年正常工作天數244天，1箱可供一營業單位每天21次現金收受。",["0箱","1箱","2箱"],"箱"],

  ["傳票厚紙板","此厚紙板一包為1,000張。原始表單說明為依115年工作天數，1包可供一營業單位每天使用4張；請確認是否應修正為116年工作天數。",["0包","1包","2包"],"包"]

 const btn=$("load116Template");btn.disabled=true;
 try{
  for(let i=0;i<items.length;i++){

    question_type:"single_choice",is_required:true,
    settings:{unit_label:x[3],allow_other:true}
   }).select("id").single();
   if(error)throw error;
   const {error:oe}=await db.from("general_survey_options").insert(x[2].map((label,j)=>({question_id:q.id,sort_order:j+1,label,value:label})));
   if(oe)throw oe;
  }
  const {error:te}=await db.from("general_survey_questions").insert({
   survey_id:selected.id,sort_order:14,title:"其他傳票大量需求",

 finally{btn.disabled=false;}

$("createSurvey").addEventListener("click",createSurvey);

init().catch(e=>{console.error(e);$("identity").textContent="登入或初始化失敗";note("notice",e.message||String(e),"error");});
