<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>年度大量傳票需求管理｜淡水信用合作社</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#334136;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{background:#14532d;color:#fff;padding:20px 16px}header>div,main{max-width:820px;margin:auto}
.brand{font-size:14px;opacity:.9;margin-bottom:4px}.brand-title{font-size:21px;font-weight:700}
main{padding:26px 16px 48px}.heading h1{font-size:25px;color:#14532d;margin:0 0 8px}.heading p{color:#647067;line-height:1.75;margin:0 0 18px}
.panel{background:#fff;border:1px solid #dfe7e1;border-radius:13px;padding:22px;margin-bottom:16px;box-shadow:0 2px 8px #14532d0b}
.status{padding:13px 15px;border-radius:8px;background:#f4f7f4;color:#59675d;line-height:1.7;margin-bottom:16px;white-space:pre-wrap}
.status.open{background:#edf6ef;color:#315b3c}.status.closed{background:#fbf0ef;color:#8a4540}
label{display:block;font-weight:650;font-size:14px;margin:0 0 7px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd7ce;border-radius:8px;font:inherit;background:#fff;color:#334136;min-height:44px}
.field{margin-bottom:17px}.question{border:1px solid #e1e8e2;background:#fbfcfb;border-radius:10px;padding:16px;margin:14px 0}
.q-title{font-weight:700;margin-bottom:6px}.q-desc{font-size:13px;color:#6b776e;line-height:1.65;margin-bottom:12px;white-space:pre-wrap}
.q-image{display:block;max-width:100%;max-height:300px;object-fit:contain;margin:10px 0 14px;border-radius:8px;border:1px solid #e5eae6;background:white}
.required{color:#b42318;margin-left:5px}.options{display:grid;gap:9px}.option{display:flex;align-items:center;gap:9px;font-weight:400;margin:0}.option input{width:18px;height:18px;min-height:18px}
button{width:100%;border:0;border-radius:8px;background:#14532d;color:#fff;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;min-height:48px}
button:disabled{opacity:.55;cursor:not-allowed}.hint{font-size:13px;color:#6b776e;line-height:1.7;margin-top:12px}
.hidden{display:none!important}.error{color:#b42318}.success{color:#166534}
@media(max-width:600px){main{padding:20px 12px 36px}.panel{padding:17px}.heading h1{font-size:22px}}
</style>
</head>
<body>
<header><div><div class="brand">淡水信用合作社</div><div class="brand-title">年度大量傳票需求管理</div></div></header>
<main>
  <section class="heading"><h1 id="surveyTitle">問卷載入中……</h1><p id="surveyDescription"></p></section>
  <div id="status" class="status">正在確認問卷開放期間……</div>
  <section class="panel" id="formPanel">
    <div class="field"><label for="unit">填報單位</label><select id="unit"><option value="">請選擇單位</option></select></div>
    <div class="field"><label for="submitter">填報人</label><input id="submitter" maxlength="50" placeholder="請輸入姓名"></div>
    <div id="questions"></div>
    <button id="submitBtn" type="button" disabled>送出填報資料</button>
    <div class="hint" id="formHint">填報期間內可再次提交；系統將以最後一次提交內容作為正式資料。</div>
  </section>
  <div id="message" class="hint" role="status"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";
const SUPABASE_URL="https://onebxqajsiqmhfcizaxl.supabase.co";
const SUPABASE_KEY="sb_publishable_TihaeP-c-zcnydbqeuN7_A_Qc9eL7Zq";
const IMAGE_BASE=SUPABASE_URL+"/storage/v1/object/public/general-survey-images/";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const token=new URLSearchParams(location.search).get("token");
const $=id=>document.getElementById(id);
let surveyData=null, currentUnitId="", busy=false;
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function imageUrl(path){return path?IMAGE_BASE+path.split("/").map(encodeURIComponent).join("/"):"";}
function setMessage(msg,type){$("message").className="hint "+(type||"");$("message").textContent=msg||"";}
function setOpenState(open,msg){
  $("status").className="status "+(open?"open":"closed");
  $("status").textContent=msg;
  $("formPanel").classList.toggle("hidden",!open);
  $("submitBtn").disabled=!open;
}
function renderQuestion(q,value){
  const wrap=document.createElement("div");wrap.className="question";wrap.dataset.questionId=q.id;
  const title=document.createElement("div");title.className="q-title";title.textContent=q.title;
  if(q.is_required){const star=document.createElement("span");star.className="required";star.textContent="*";title.appendChild(star);}
  wrap.appendChild(title);
  if(q.description){const d=document.createElement("div");d.className="q-desc";d.textContent=q.description;wrap.appendChild(d);}
  if(q.image_path){const img=document.createElement("img");img.className="q-image";img.src=imageUrl(q.image_path);img.alt=q.title;img.loading="lazy";wrap.appendChild(img);}
  const settings=q.settings||{};let control;
  if(q.question_type==="textarea"){
    control=document.createElement("textarea");control.rows=3;control.placeholder=settings.placeholder||"請輸入內容";control.value=value==null?"":String(value);
  }else if(q.question_type==="single_choice"||q.question_type==="multiple_choice"){
    control=document.createElement("div");control.className="options";
    (q.options||[]).forEach(o=>{
      const label=document.createElement("label");label.className="option";
      const input=document.createElement("input");input.type=q.question_type==="single_choice"?"radio":"checkbox";input.name="q_"+q.id;input.value=o.value;
      if(q.question_type==="multiple_choice"&&Array.isArray(value)&&value.includes(o.value))input.checked=true;
      if(q.question_type==="single_choice"&&value===o.value)input.checked=true;
      label.appendChild(input);
      const span=document.createElement("span");span.textContent=o.label;label.appendChild(span);
      if(o.image_path){const img=document.createElement("img");img.src=imageUrl(o.image_path);img.alt=o.label;img.style.cssText="width:76px;height:76px;object-fit:contain;margin-left:auto";label.appendChild(img);}
      control.appendChild(label);
    });
    if(q.question_type==="single_choice"&&settings.allow_other){
      const otherLabel=document.createElement("label");otherLabel.className="option";
      const otherRadio=document.createElement("input");otherRadio.type="radio";otherRadio.name="q_"+q.id;otherRadio.value="__other__";
      otherLabel.appendChild(otherRadio);const otherText=document.createElement("span");otherText.textContent="其他";otherLabel.appendChild(otherText);control.appendChild(otherLabel);
      const otherInput=document.createElement("input");otherInput.type="text";otherInput.placeholder="請填寫其他需求";otherInput.dataset.otherText="true";otherInput.style.marginTop="8px";otherInput.hidden=true;control.appendChild(otherInput);
      control.addEventListener("change",()=>{const selected=control.querySelector('input[type="radio"]:checked');otherInput.hidden=!(selected&&selected.value==="__other__");});
    }
  }else{
    control=document.createElement("input");
    control.type=q.question_type==="number"?"number":q.question_type==="date"?"date":"text";
    if(q.question_type==="number"){control.min=settings.min??0;control.max=settings.max??"";control.step=settings.step??1;}
    control.placeholder=settings.placeholder||"請輸入"+(q.question_type==="number"?"數量":"內容");
    control.value=value==null?"":String(value);
  }
  control.dataset.answerControl="true";wrap.appendChild(control);
  if(q.question_type==="number"&&settings.unit_label){const unit=document.createElement("div");unit.className="hint";unit.textContent="單位："+settings.unit_label;wrap.appendChild(unit);}
  return wrap;
}
function getQuestionAnswer(q,el){
  if(q.question_type==="single_choice"){
    const x=el.querySelector('input[type="radio"]:checked');
    if(!x)return null;
    if(x.value==="__other__"){const other=el.querySelector("[data-other-text]");return {choice:"__other__",other:other?other.value.trim():""};}
    return x.value;
  }
  if(q.question_type==="multiple_choice")return Array.from(el.querySelectorAll("input:checked")).map(x=>x.value);
  const c=el.querySelector("[data-answer-control]");
  if(!c||c.value==="")return null;
  if(q.question_type==="number")return Number(c.value);
  return c.value;
}
function validateAndCollect(){
  const answers=[];
  for(const q of surveyData.questions){
    const el=$("questions").querySelector('[data-question-id="'+q.id+'"]');
    const answer=getQuestionAnswer(q,el);
    const otherIsEmpty=answer&&typeof answer==="object"&&answer.choice==="__other__"&&!answer.other;
    if(q.is_required&&(answer===null||(Array.isArray(answer)&&!answer.length)||otherIsEmpty)){
      throw new Error("請完成必填題目：「"+q.title+"」。");
    }
    if(answer!==null&&!otherIsEmpty)answers.push({question_id:q.id,answer:answer});
  }
  return answers;
}
async function loadUnitData(){
  const unitId=$("unit").value;currentUnitId=unitId;
  $("questions").innerHTML="";
  $("submitter").value="";
  if(!unitId||!surveyData)return;
  try{
    const {data,error}=await db.rpc("general_survey_public_info",{p_token:token,p_unit_id:Number(unitId)});
    if(error)throw error;
    if(!data||!data.ok)throw new Error(data?.message||"讀取填報資料失敗。");
    const alreadySubmitted=data.submission===true;
    surveyData.questions.forEach(q=>$("questions").appendChild(renderQuestion(q,null)));
    setMessage(alreadySubmitted?"本單位已有填報紀錄。再次提交將取代原內容，請重新填寫完整資料。":"請填寫本單位本年度預估需求。","success");
  }catch(e){setMessage(e.message||"讀取資料失敗。","error");}
}
async function init(){
  if(!token){setOpenState(false,"問卷網址缺少識別碼，請向總務課索取正確連結。");return;}
  try{
    const {data,error}=await db.rpc("general_survey_public_info",{p_token:token,p_unit_id:null});
    if(error)throw error;
    if(!data||!data.ok){setOpenState(false,data?.message||"無法讀取問卷。");return;}
    surveyData=data;
    $("surveyTitle").textContent=data.survey.title;
    $("surveyDescription").textContent=data.survey.description||"請依實際情形填寫各項需求。";
    const open=data.is_open===true;
    if(!data.survey.is_published)setOpenState(false,"本問卷尚未發布。");
    else if(Date.now()<new Date(data.survey.opens_at).getTime())setOpenState(false,"本問卷尚未開始，開放時間："+new Date(data.survey.opens_at).toLocaleString("zh-TW"));
    else if(Date.now()>new Date(data.survey.closes_at).getTime())setOpenState(false,"本問卷填報期限已截止。");
    else setOpenState(open,"目前開放填報。截止時間："+new Date(data.survey.closes_at).toLocaleString("zh-TW"));
    if(!open)return;
    (data.units||[]).forEach(u=>{const op=document.createElement("option");op.value=u.id;op.textContent=u.name;$("unit").appendChild(op);});
    if(!data.units?.length){setOpenState(false,"本問卷尚未指定填報單位，請聯絡總務課。");return;}
    $("unit").addEventListener("change",loadUnitData);
    $("submitBtn").addEventListener("click",submit);
    $("unit").disabled=false;
  }catch(e){console.error(e);setOpenState(false,"問卷載入失敗，請通知總務課處理。");setMessage(e.message||String(e),"error");}
}
async function submit(){
  if(busy)return;
  if(!currentUnitId){setMessage("請先選擇填報單位。","error");return;}
  const name=$("submitter").value.trim();
  if(!name){setMessage("請填寫填報人姓名。","error");$("submitter").focus();return;}
  let answers;
  try{answers=validateAndCollect();}catch(e){setMessage(e.message,"error");return;}
  busy=true;$("submitBtn").disabled=true;$("submitBtn").textContent="送出中……";
  try{
    const {data,error}=await db.rpc("general_survey_submit",{p_token:token,p_unit_id:Number(currentUnitId),p_submitter_name:name,p_answers:answers});
    if(error)throw error;
    if(!data||!data.ok)throw new Error(data?.message||"送出失敗。");
    setMessage("資料已成功送出。您仍可在截止前再次修改及提交。","success");
    await loadUnitData();
  }catch(e){console.error(e);setMessage("送出失敗："+(e.message||String(e)),"error");}
  finally{busy=false;$("submitBtn").disabled=false;$("submitBtn").textContent="送出填報資料";}
}
init();
})();
</script>
</body>
</html>
